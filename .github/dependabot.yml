version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Node.js type definitions track the oldest supported runtime in `engines`
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
