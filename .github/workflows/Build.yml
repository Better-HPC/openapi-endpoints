name: 🤖 Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Set the version number of the compiled package.'
        default: '0.0.0'
        required: false
        type: string

jobs:
  build-npm:
    name: npm Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      # Packing runs the `prepack` script, which compiles the sources into dist/
      - name: Build npm package
        run: npm pack --pack-destination package

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-endpoints
          path: package
